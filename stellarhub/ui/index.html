<html lang="en" data-theme="deep">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StellarHub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='3.2' fill='%23FF7A66'/%3E%3Cellipse cx='12' cy='12' rx='10' ry='4' transform='rotate(-24 12 12)' fill='none' stroke='%239ED6FF' stroke-width='1.4'/%3E%3C/svg%3E">
<style>
/* loading screen: on the very first paint, before the stylesheets and scripts, gone once the app is ready (shell.js) */
#boot{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(600px 360px at 50% 46%,rgba(158,214,255,.07),transparent 70%),#060A14;color:#E8EEF8;font:400 13px/1.4 system-ui,"Segoe UI",sans-serif;transition:opacity .45s ease}
#boot.out{opacity:0;pointer-events:none}
#boot .bt{display:flex;flex-direction:column;align-items:center;gap:18px}
#boot svg{width:84px;height:84px;overflow:visible;filter:drop-shadow(0 0 22px rgba(255,122,102,.28))}
#boot .moon{transform-origin:12px 12.6px;animation:btOrbit 2.6s linear infinite}
#boot .planet{transform-origin:12px 12.6px;animation:btBreath 2.6s ease-in-out infinite}
#boot b{font:600 19px/1 system-ui,"Segoe UI",sans-serif;letter-spacing:-.01em}
#boot .bar{position:relative;width:150px;height:3px;border-radius:2px;background:rgba(232,238,248,.08);overflow:hidden}
#boot .bar i{position:absolute;top:0;bottom:0;width:38%;border-radius:2px;background:linear-gradient(90deg,#9ED6FF,#FF7A66);animation:btBar 1.3s ease-in-out infinite}
#boot .msg{min-height:18px;max-width:320px;text-align:center;color:rgba(232,238,248,.55);font-size:12.5px;transition:opacity .3s}
@keyframes btOrbit{to{transform:rotate(360deg)}}
@keyframes btBreath{50%{transform:scale(1.06)}}
@keyframes btBar{from{left:-38%}to{left:100%}}
@media (prefers-reduced-motion:reduce){#boot .moon,#boot .planet{animation:none}#boot .bar i{animation:none;left:0;width:100%;opacity:.5}}
</style>
<link rel="stylesheet" href="css/base.css">

<body>
<div id="boot" aria-busy="true"><div class="bt">
  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M1.8 12.6A10.2 3 0 0 1 22.2 12.6" transform="rotate(-20 12 12.6)" stroke="#9ED6FF" stroke-opacity=".5" stroke-width="1.1"/><circle class="planet" cx="12" cy="12.6" r="5.2" fill="#FF7A66"/><path d="M22.2 12.6A10.2 3 0 0 1 1.8 12.6" transform="rotate(-20 12 12.6)" stroke="#9ED6FF" stroke-width="1.1"/><circle class="moon" cx="19.6" cy="4.4" r="1.4" fill="#9ED6FF"/></svg>
  <b>StellarHub</b><div class="bar"><i></i></div><div class="msg" id="bootMsg"></div></div></div>
<div class="rz" data-edge="n"></div><div class="rz" data-edge="s"></div><div class="rz" data-edge="w"></div><div class="rz" data-edge="e"></div>
<div class="rz" data-edge="nw"></div><div class="rz" data-edge="ne"></div><div class="rz" data-edge="sw"></div><div class="rz" data-edge="se"></div>
<div class="atmo"></div>
<canvas id="stars"></canvas>

<header class="top">
  <div class="brand" id="brand" title="Go Home">
    <svg viewBox="0 0 24 24" fill="none"><defs><radialGradient id="brandShade" cx="10" cy="10.2" r="7.8" gradientUnits="userSpaceOnUse"><stop offset=".35" stop-opacity="0"/><stop offset="1" stop-opacity=".32"/></radialGradient><mask id="brandGap"><rect width="24" height="24" fill="#fff"/><path d="M22.2 12.6A10.2 3 0 0 1 1.8 12.6" transform="rotate(-20 12 12.6)" fill="none" stroke="#000" stroke-width="2.5"/></mask></defs><path d="M1.8 12.6A10.2 3 0 0 1 22.2 12.6" transform="rotate(-20 12 12.6)" style="stroke:var(--accent2)" stroke-opacity=".55" stroke-width="1.6"/><g mask="url(#brandGap)"><circle cx="12" cy="12.6" r="5.2" style="fill:var(--accent)"/><circle cx="12" cy="12.6" r="5.2" fill="url(#brandShade)"/></g><path d="M22.2 12.6A10.2 3 0 0 1 1.8 12.6" transform="rotate(-20 12 12.6)" style="stroke:var(--accent2)" stroke-width="1.6"/><circle cx="19.6" cy="4.4" r="1.5" style="fill:var(--accent2)"/></svg>
    StellarHub
  </div>
  <button class="search" id="searchBtn" aria-label="Search" data-t-attr="aria-label">
    <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
    <span data-t>Search for a tool or action</span>
    <span class="kbd">Ctrl K</span>
  </button>
  <div class="right">
    <button class="mode" id="modePill"><span class="d"></span><span id="modeTxt" data-t>Normal mode</span></button>
    <button class="iconbtn" id="widgetBtn" aria-label="Always-on-top widget" title="Always-on-top widget" data-t-attr="aria-label title">
      <svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M13 5v14M13 12h7.5"/></svg>
    </button>
    <button class="iconbtn" id="gearBtn" aria-label="Settings" title="Settings (Ctrl ,)" data-t-attr="aria-label title">
      <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <div class="winctl" aria-label="Window" data-t-attr="aria-label">
      <button class="wc" id="winMin" aria-label="Minimize" title="Minimize" data-t-attr="aria-label title"><svg class="i" viewBox="0 0 24 24"><path d="M6 12.5h12"/></svg></button>
      <button class="wc" id="winMax" aria-label="Maximize" title="Maximize" data-t-attr="aria-label title"><svg class="i" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.8"/></svg></button>
      <button class="wc close" id="winClose" aria-label="Close" title="Close" data-t-attr="aria-label title"><svg class="i" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
    </div>
    <div class="note" id="adminNote" role="dialog" aria-label="Administrator mode" data-t-attr="aria-label">
      <p><b data-t>Turn on administrator mode</b> <span id="noteReason"></span></p>
      <div class="row-btns"><button class="btn pri" id="adminYes" data-t>Turn on</button><button class="btn ghost" id="adminNo" data-t>Not now</button></div>
      <label><span class="check" id="noteNever"><svg class="i" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span><span data-t>Don’t suggest this again</span></label>
    </div>
  </div>
</header>

<main id="views">
  <section class="view is-on" data-view="home" id="v-home"></section>
</main>

<nav class="dock" id="dock" aria-label="Modules" data-t-attr="aria-label"></nav>

    <div class="in"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      <input id="palIn" placeholder="Type what you want to do" data-t-attr="placeholder" autocomplete="off" spellcheck="false"></div>

    <div class="foot"><span data-t>Arrows to move</span><span data-t>Enter to open</span><span data-t>Esc to close</span></div>
  </div>
</div>
